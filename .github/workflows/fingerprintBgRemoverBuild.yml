name: Build Fingerprint BG Remover

on:
  push:
    branches:
      - 'fingerprint-bg-remover'
    paths:
      - 'FingerprintBgRemover/**'
      - '.github/workflows/fingerprintBgRemoverBuild.yml'
  pull_request:
    paths:
      - 'FingerprintBgRemover/**'
      - '.github/workflows/fingerprintBgRemoverBuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FingerprintBgRemover

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: FingerprintBgRemover

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build platform
        run: sdkmanager --install "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify the module APK was produced
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FingerprintBgRemover
          path: FingerprintBgRemover/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
